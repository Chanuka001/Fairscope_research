name: FairScope CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  lint-test-build:
    name: Lint, Test & Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      # 1. Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 for Android Gradle builds
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Set up Flutter SDK (stable channel with caching)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. Install Flutter package dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Check code formatting & static analysis (fails on any error)
      - name: Analyze code
        run: flutter analyze

      # 6. Run all unit and widget tests
      - name: Run automated test suite
        run: flutter test

      # 7. Build production Release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 8. Upload the built APK as a downloadable GitHub artifact
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fairscope-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

